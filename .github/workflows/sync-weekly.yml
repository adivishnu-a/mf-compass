name: Weekly Full Rebuild (J-002)

on:
  schedule:
    # 02:30 IST Sunday (21:00 UTC Saturday)
    - cron: "0 21 * * 0"
  workflow_dispatch:

jobs:
  rebuild:
    name: Run Weekly Rebuild
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Execute Weekly Rebuild Script
        run: npm run sync:weekly
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NODE_ENV: production

      - name: Upload Sync Summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sync-weekly-summary-${{ github.run_number }}
          path: summary.json
          retention-days: 7

      - name: Upload Rebuild Logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sync-weekly-failure-logs-${{ github.run_number }}
          path: "*.log"
          retention-days: 7
